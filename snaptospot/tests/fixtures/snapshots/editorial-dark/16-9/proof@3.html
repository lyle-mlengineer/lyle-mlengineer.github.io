<style>
  .sts-card {
    --bg: #0a0c11; --bg-alt: #0d1017; --surface: #121620;
    --paper: #f7f4ef; --muted: #b8bfcc; --muted-2: #8b93a3;
    --accent: #ff4d8a; --accent-soft: #ff98bb; --on-accent: #111111;
    --line: rgba(255,255,255,.11); --radius: 10px; --rule: 1px;
    --font-display: 'Bahnschrift'; --font-body: 'Segoe UI'; --font-mono: 'Consolas';
    --tracking: -0.03em; --transform: uppercase;
    --shadow: 0 14px 34px rgba(0,0,0,.42);
  }
</style>
<style>
  .sts-card, .sts-card * { box-sizing: border-box; }
  .sts-card {
    position: relative; overflow: hidden; display: flex; flex-direction: column;
    padding: 64px; background: var(--bg); color: var(--paper);
    font-family: var(--font-body), system-ui, sans-serif;
    --headline-pt: 78px;
  }
  .sts-card.ratio-1-1 { width: 1200px; height: 1200px; }
  .sts-card.ratio-4-5 { width: 1080px; height: 1350px; padding: 68px; }
  .sts-card.ratio-16-9 { width: 1600px; height: 900px; padding: 56px 64px; }
  .sts-card.ratio-9-16 { width: 1080px; height: 1920px; padding: 96px 64px 140px; }
  .sts-glow {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(circle at 78% 18%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 58%);
    opacity: .8;
  }
  .sts-card > *:not(.sts-glow) { position: relative; z-index: 1; }
  .sts-kicker {
    display: flex; align-items: center; gap: 16px; color: var(--muted);
    font-family: var(--font-mono), ui-monospace, monospace;
    font-size: 15px; letter-spacing: .14em; text-transform: uppercase;
    min-height: 22px;
  }
  .sts-kicker:after { content: ""; height: 1px; flex: 1; background: var(--line); }
  .sts-headline {
    margin: 22px 0 0; font-family: var(--font-display), var(--font-body), sans-serif;
    font-size: var(--headline-pt); line-height: .96; letter-spacing: var(--tracking);
    text-transform: var(--transform); hyphens: none; overflow-wrap: normal; word-break: normal;
    max-height: calc(var(--headline-pt) * .96 * 3); text-wrap: balance;
  }
  .sts-headline em { font-style: normal; color: var(--accent); }
  .card-hero .sts-headline { max-height: calc(var(--headline-pt) * .96 * 5); }
  .sts-subhead { margin: 18px 0 0; color: var(--muted); font-size: 22px; line-height: 1.35; max-width: 44ch; }
  .sts-hero-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.12fr .88fr; gap: 44px; align-items: center; }
  .ratio-16-9 .sts-hero-main { grid-template-columns: 1.35fr .65fr; }
  .ratio-4-5 .sts-hero-main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; align-items: start; }
  .ratio-9-16 .sts-hero-main { grid-template-columns: 1fr; grid-template-rows: 1.05fr .95fr; align-items: center; }
  .sts-hero-copy { min-width: 0; }
  .ratio-9-16 .sts-hero-copy { align-self: end; }
  .sts-portrait { position: relative; justify-self: center; align-self: center; width: min(100%, 410px); aspect-ratio: 1 / 1; }
  .ratio-16-9 .sts-portrait { width: min(100%, 330px); }
  .ratio-4-5 .sts-portrait { width: min(100%, 360px); margin-top: 24px; }
  .ratio-9-16 .sts-portrait { width: min(100%, 620px); }
  .sts-ring { position: absolute; inset: -12px; border-radius: 50%; }
  .sts-portrait img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
    filter: grayscale(1) sepia(.16) saturate(1.08) contrast(1.03);
    box-shadow: 0 30px 70px rgba(0,0,0,.38);
  }
  .sts-tiles { display: grid; gap: 20px; flex: 1; min-height: 0; margin-top: 34px; }
  .sts-tile { min-width: 0; min-height: 0; border-top: var(--rule) solid var(--line); padding-top: 16px; }
  .sts-tile-title { margin: 0; font-family: var(--font-display), var(--font-body), sans-serif; font-size: 27px; line-height: 1.08; letter-spacing: var(--tracking); }
  .sts-tile-blurb { margin: 10px 0 0; color: var(--muted); font-size: 17px; line-height: 1.38; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .sts-tile-metric { margin-top: 14px; color: var(--accent); font-family: var(--font-mono), ui-monospace, monospace; font-size: 16px; }
  .capabilities.columns .sts-tiles { grid-template-columns: repeat(var(--cols, 4), 1fr); align-content: start; }
  .capabilities.rows .sts-tiles { grid-template-columns: 1fr; grid-auto-rows: 1fr; align-content: stretch; }
  .capabilities.grid .sts-tiles { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 1fr; align-content: stretch; }
  .projects .sts-tiles { align-content: start; }
  .projects .sts-tiles { grid-template-columns: repeat(var(--cols, 2), 1fr); grid-template-rows: repeat(var(--rows, 2), minmax(0, 1fr)); }
  .projects .sts-tile { display: flex; flex-direction: column; border-top: 0; padding-top: 0; }
  .sts-shot { margin: 0; flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
  .sts-shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .sts-shot-empty { width: 100%; height: 100%; background: linear-gradient(135deg, var(--bg-alt), var(--surface)); }
  .sts-tile-copy { padding: 12px 2px 0; min-height: 0; }
  .projects .sts-tile-title { font-size: 22px; }
  .projects .sts-tile-blurb { font-size: 15px; -webkit-line-clamp: 2; }
  .sts-badge { display: inline-block; margin-top: 8px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--paper); font-family: var(--font-mono), ui-monospace, monospace; font-size: 13px; }
  .sts-proof-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.02fr .98fr; gap: 44px; margin-top: 30px; align-items: stretch; }
  .ratio-16-9 .sts-proof-body { grid-template-columns: 1fr .92fr; gap: 40px; }
  .ratio-4-5 .sts-proof-body, .ratio-9-16 .sts-proof-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; gap: 28px; }
  .sts-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; align-content: start; min-height: 0; }
  .stats-rows .sts-stats { grid-template-columns: 1fr; }
  .stats-2x2 .sts-stats { grid-template-columns: repeat(2, 1fr); }
  .sts-stat { border-top: var(--rule) solid var(--line); padding-top: 14px; min-width: 0; }
  .sts-stat-value { font-family: var(--font-display), var(--font-body), sans-serif; font-size: 62px; line-height: .96; letter-spacing: var(--tracking); }
  .ratio-16-9 .sts-stat-value { font-size: 54px; }
  .ratio-9-16 .sts-stat-value { font-size: 68px; }
  .sts-stat-unit { margin-left: 4px; font-size: .44em; color: var(--muted); }
  .sts-stat-label { margin-top: 8px; color: var(--muted); font-size: 16px; line-height: 1.3; }
  .sts-stat-date { margin-top: 6px; color: var(--muted-2); font-family: var(--font-mono), ui-monospace, monospace; font-size: 12px; }
  .sts-quote { display: flex; flex-direction: column; justify-content: center; border-left: var(--rule) solid var(--accent); padding-left: 26px; min-height: 0; }
  .ratio-4-5 .sts-quote, .ratio-9-16 .sts-quote { border-left: 0; border-top: var(--rule) solid var(--accent); padding: 22px 0 0; justify-content: start; }
  .sts-quote-text { margin: 0; font-family: var(--font-display), var(--font-body), serif; font-size: 31px; line-height: 1.2; letter-spacing: var(--tracking); }
  .ratio-16-9 .sts-quote-text { font-size: 27px; }
  .ratio-9-16 .sts-quote-text { font-size: 34px; }
  .sts-quote-attr { margin-top: 18px; color: var(--muted); font-family: var(--font-mono), ui-monospace, monospace; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; }
  .sts-footer { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-top: 28px; padding-top: 18px; border-top: var(--rule) solid var(--line); min-height: 0; }
  .sts-cta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .sts-cta-label { color: var(--muted); font-family: var(--font-mono), ui-monospace, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }
  .sts-cta-url { font-family: var(--font-mono), ui-monospace, monospace; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sts-qr { display: flex; align-items: center; gap: 12px; color: var(--muted); font-family: var(--font-mono), ui-monospace, monospace; font-size: 11px; }
  .sts-qr svg { width: 92px; height: 92px; background: #fff; padding: 6px; border-radius: 4px; }
  .ratio-9-16 .sts-qr svg { width: 112px; height: 112px; }
</style>
<div class="sts-card ratio-16-9 card-proof proof-stats_quote_side template-proof-stats_quote_side"
     data-template="proof.stats_quote_side" data-density="3"
     style="--cols: 2; --rows: 2">
  <div class="sts-glow"></div>
  <div class="sts-kicker" data-slot="eyebrow"><span>Proof</span></div>
  <h1 class="sts-headline" data-slot="headline" style="--headline-pt: 78px">Proof, not <em>promises.</em></h1><p class="sts-subhead" data-slot="subhead">Every number carries a source.</p>
  <div class="sts-proof-body">

      <div class="sts-stat" data-slot="stat-1" data-fact-id="f-wer">

      </div>
      <div class="sts-stat" data-slot="stat-2" data-fact-id="f-latency">
        <div class="sts-stat-value">240<span class="sts-stat-unit">ms</span></div>

      </div>
    </div>
    <div class="sts-quote" data-slot="quote" data-fact-id="f-quote">
      <p class="sts-quote-text">“The first system that survived contact with our users.”</p>
      <div class="sts-quote-attr">Head of Platform · Client</div>
    </div>
  </div>
  <div class="sts-footer">
    
<div class="sts-cta" data-slot="cta">
