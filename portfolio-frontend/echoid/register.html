<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — EchoID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body class="app-page">

  <header class="app-header">
    <div class="app-header__inner">
      <a href="index.html" class="logo">EchoID</a>
      <a href="login.html" class="btn btn--ghost btn--sm" style="margin-left:auto">I have an account</a>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="card auth-card">
      <h1 class="display auth-card__title">CREATE YOUR ACCOUNT</h1>
      <p class="auth-card__sub">Start transcribing in under a minute. No card required.</p>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" autocomplete="name" placeholder="Ada Lovelace" required />
          <span class="field__error" data-for="name"></span>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@company.com" required />
          <span class="field__error" data-for="email"></span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" placeholder="At least 6 characters" required />
          <span class="field__error" data-for="password"></span>
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" name="confirm" autocomplete="new-password" placeholder="Repeat password" required />
          <span class="field__error" data-for="confirm"></span>
        </div>
        <div class="field">
          <label for="plan">Starting plan</label>
          <select id="plan" name="plan">
            <option value="starter">Starter — $19/mo</option>
            <option value="growth" selected>Growth — $79/mo</option>
            <option value="enterprise">Enterprise — custom</option>
          </select>
        </div>
        <button type="submit" class="btn btn--solid">Create account</button>
      </form>

      <p class="auth-alt">Already registered? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="auth.js"></script>
</body>
</html>
